<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MaxText base.yml — config mind map</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222c; --border:#2a2f3a; --border-soft:#232732;
    --text:#e7e9ee; --text-dim:#9aa1af; --text-faint:#6b7180;
    --accent:#7aa2f7; --accent-dim:#3a4a6b;
    --c1:#7f77dd; --c2:#1d9e75; --c3:#d85a30; --c4:#d4537e; --c5:#378add;
    --c6:#639922; --c7:#ba7517; --c8:#e24b4a; --c9:#888780;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f7f7f5; --panel:#ffffff; --panel2:#f1f1ee; --border:#e0e0da; --border-soft:#ececE7;
      --text:#1f2023; --text-dim:#5f5e5a; --text-faint:#8a8a84;
      --accent:#185fa5; --accent-dim:#dbe8f7;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px; margin:0 auto;}
  header{margin-bottom:20px;}
  h1{font-size:19px; font-weight:600; margin:0 0 4px;}
  .sub{font-size:13px; color:var(--text-dim); margin:0;}
  .searchbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 0 10px; margin-bottom:8px;
  }
  #search{
    width:100%; padding:11px 14px; font-size:14px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--text-faint); margin-top:8px; gap:8px; flex-wrap:wrap;
  }
  .btnrow{display:flex; gap:6px;}
  .btn{
    font-size:12px; padding:5px 10px; border-radius:7px; border:1px solid var(--border);
    background:var(--panel); color:var(--text-dim); cursor:pointer;
  }
  .btn:hover{color:var(--text); border-color:var(--text-faint);}
  #nomatch{display:none; text-align:center; color:var(--text-faint); font-size:13px; padding:40px 0;}

  .umbrella{
    border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden;
    background:var(--panel);
  }
  .umbrella.hidden{display:none;}
  .u-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; cursor:pointer; user-select:none;
  }
  .u-head:hover{background:var(--panel2);}
  .u-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .u-dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .u-name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .u-count{
    font-size:11px; color:var(--text-faint); background:var(--panel2);
    border:1px solid var(--border-soft); padding:2px 8px; border-radius:20px; flex:none;
  }
  .chev{
    font-size:11px; color:var(--text-faint); transition:transform .15s ease; flex:none;
  }
  .umbrella.open .chev{transform:rotate(90deg);}
  .u-body{display:none; padding:0 16px 14px;}
  .umbrella.open .u-body{display:block;}

  .subgroup{margin-top:10px;}
  .s-head{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    padding:4px 0;
  }
  .s-name{font-size:12.5px; font-weight:600; color:var(--text-dim);}
  .s-count{font-size:11px; color:var(--text-faint);}
  .s-chev{font-size:9px; color:var(--text-faint); transition:transform .15s ease;}
  .subgroup.open .s-chev{transform:rotate(90deg);}
  .s-body{display:none; padding:8px 0 2px 2px; flex-wrap:wrap; gap:6px;}
  .subgroup.open .s-body{display:flex;}

  .chip{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px; padding:4px 8px; border-radius:6px;
    background:var(--panel2); border:1px solid var(--border-soft); color:var(--text-dim);
    white-space:nowrap;
  }
  .chip mark{background:var(--accent-dim); color:var(--accent); border-radius:3px; padding:0 1px;}
  .chip.hidden{display:none;}

  .subgroup.hidden{display:none;}

  mark.head-mark{background:var(--accent-dim); color:var(--accent); border-radius:3px; padding:0 1px;}

  footer{margin-top:26px; font-size:11.5px; color:var(--text-faint); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MaxText <code style="font-weight:400">base.yml</code> — config mind map</h1>
    <p class="sub">688 parameters &middot; 15 umbrella categories &middot; navigate or search to find where a setting lives</p>
  </header>

  <div class="searchbar">
    <input id="search" type="text" placeholder="Search a parameter name (e.g. sliding_window, remat, dcn_fsdp)…" autocomplete="off">
    <div class="meta-row">
      <span id="resultcount"></span>
      <div class="btnrow">
        <button class="btn" id="expandAll">Expand all</button>
        <button class="btn" id="collapseAll">Collapse all</button>
      </div>
    </div>
  </div>

  <div id="tree"></div>
  <div id="nomatch">No parameters match that search.</div>

  <footer>Generated from base.yml &middot; grouping is a navigation aid, not an explanation of what each parameter does</footer>
</div>

const COLORS = ["c1","c2","c3","c4","c5","c6","c7","c8","c9","c1","c2","c3","c4","c5"];

const treeEl = document.getElementById('tree');
const searchEl = document.getElementById('search');
const resultcountEl = document.getElementById('resultcount');
const nomatchEl = document.getElementById('nomatch');

function render(){
  treeEl.innerHTML = '';
  DATA.forEach((umb, ui) => {
    const uDiv = document.createElement('div');
    uDiv.className = 'umbrella';
    uDiv.dataset.uindex = ui;

    const head = document.createElement('div');
    head.className = 'u-head';
    head.innerHTML = `
      <div class="u-left">
        <span class="u-dot" style="background:var(--${COLORS[ui % COLORS.length]})"></span>
        <span class="u-name">${umb.name}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="u-count">${umb.count}</span>
        <span class="chev">&#9656;</span>
      </div>`;
    head.addEventListener('click', () => uDiv.classList.toggle('open'));
    uDiv.appendChild(head);

    const body = document.createElement('div');
    body.className = 'u-body';

    umb.subs.forEach((sub, si) => {
      const sDiv = document.createElement('div');
      sDiv.className = 'subgroup';
      sDiv.dataset.sindex = si;

      const sHead = document.createElement('div');
      sHead.className = 's-head';
      sHead.innerHTML = `<span class="s-chev">&#9656;</span><span class="s-name">${sub.name}</span><span class="s-count">${sub.keys.length}</span>`;
      sHead.addEventListener('click', (e) => { e.stopPropagation(); sDiv.classList.toggle('open'); });
      sDiv.appendChild(sHead);

      const sBody = document.createElement('div');
      sBody.className = 's-body';
      sub.keys.forEach(k => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = k;
        chip.dataset.key = k;
        sBody.appendChild(chip);
      });
      sDiv.appendChild(sBody);
      body.appendChild(sDiv);
    });

    uDiv.appendChild(body);
    treeEl.appendChild(uDiv);
  });
}

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function applySearch(q){
  q = q.trim().toLowerCase();
  const umbrellas = treeEl.querySelectorAll('.umbrella');
  let totalMatches = 0;

  if(q === ''){
    umbrellas.forEach(u => {
      u.classList.remove('hidden');
      u.classList.remove('open');
      u.querySelectorAll('.subgroup').forEach(s => { s.classList.remove('hidden'); s.classList.remove('open'); });
      u.querySelectorAll('.chip').forEach(c => { c.classList.remove('hidden'); c.innerHTML = c.dataset.key; });
      const nameEl = u.querySelector('.u-name'); nameEl.innerHTML = nameEl.textContent;
    });
    resultcountEl.textContent = '';
    nomatchEl.style.display = 'none';
    return;
  }

  const re = new RegExp('(' + escapeRegExp(q) + ')', 'ig');

  umbrellas.forEach(u => {
    let umbMatches = 0;
    const nameEl = u.querySelector('.u-name');
    const umbNameMatches = nameEl.textContent.toLowerCase().includes(q);

    u.querySelectorAll('.subgroup').forEach(s => {
      let subMatches = 0;
      s.querySelectorAll('.chip').forEach(c => {
        const key = c.dataset.key;
        if(key.toLowerCase().includes(q)){
          c.innerHTML = key.replace(re, '<mark>$1</mark>');
          c.classList.remove('hidden');
          subMatches++;
        } else {
          c.classList.add('hidden');
        }
      });
      if(subMatches > 0){
        s.classList.remove('hidden');
        s.classList.add('open');
      } else {
        s.classList.add('hidden');
      }
      umbMatches += subMatches;
    });

    if(umbMatches > 0 || umbNameMatches){
      u.classList.remove('hidden');
      u.classList.add('open');
      totalMatches += umbMatches;
    } else {
      u.classList.add('hidden');
    }
  });

  resultcountEl.textContent = totalMatches + ' match' + (totalMatches === 1 ? '' : 'es');
  nomatchEl.style.display = totalMatches === 0 ? 'block' : 'none';
}

searchEl.addEventListener('input', () => applySearch(searchEl.value));

document.getElementById('expandAll').addEventListener('click', () => {
  treeEl.querySelectorAll('.umbrella').forEach(u => u.classList.add('open'));
  treeEl.querySelectorAll('.subgroup').forEach(s => s.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  treeEl.querySelectorAll('.umbrella').forEach(u => u.classList.remove('open'));
  treeEl.querySelectorAll('.subgroup').forEach(s => s.classList.remove('open'));
});

render();
</script>
